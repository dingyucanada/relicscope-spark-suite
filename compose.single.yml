services:
  app:
    platform: linux/arm64
    image: ${APP_IMAGE:-relicscope-ai-demo:1.2.0-arm64}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.11-slim-bookworm}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    init: true
    read_only: true
    gpus: all
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - service_api_key
    environment:
      RELICSCOPE_DATA_DIR: /var/lib/relicscope
      RELICSCOPE_HOST: 0.0.0.0
      RELICSCOPE_PORT: "8088"
      RELICSCOPE_DEMO_MODE: ${RELICSCOPE_DEMO_MODE:-true}
      RELICSCOPE_RUNTIME_MODE: single-spark
      RELICSCOPE_NODE_ID: ${SINGLE_NODE_ID:-spark-single}
      RELICSCOPE_COMPUTE_NODE_ID: ${SINGLE_NODE_ID:-spark-single}
      RELICSCOPE_SERVICE_VERSION: ${RELICSCOPE_SERVICE_VERSION:-1.2.0}
      RELICSCOPE_OFFLINE_MODE: ${RELICSCOPE_OFFLINE_MODE:-true}
      RELICSCOPE_REQUIRE_PRIVATE_ENDPOINTS: ${RELICSCOPE_REQUIRE_PRIVATE_ENDPOINTS:-true}
      RELICSCOPE_MAX_UPLOAD_BYTES: ${RELICSCOPE_MAX_UPLOAD_BYTES:-8388608}
      RELICSCOPE_MAX_VIDEO_BYTES: ${RELICSCOPE_MAX_VIDEO_BYTES:-268435456}
      RELICSCOPE_MAX_NATIVE_VIDEO_BYTES: ${RELICSCOPE_MAX_NATIVE_VIDEO_BYTES:-33554432}
      RELICSCOPE_MAX_NATIVE_VIDEO_DURATION_MS: ${RELICSCOPE_MAX_NATIVE_VIDEO_DURATION_MS:-15000}
      RELICSCOPE_MAX_VIDEO_FRAMES: ${RELICSCOPE_MAX_VIDEO_FRAMES:-12}
      RELICSCOPE_MAX_FRAME_BYTES: ${RELICSCOPE_MAX_FRAME_BYTES:-2097152}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
      MODEL_PROFILE: ${MODEL_PROFILE:-qwen3-vl}
      VISION_BASE_URL: http://vision:8000/v1
      VISION_MODEL_SOURCE: ${VISION_MODEL_SOURCE:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      VISION_MODEL_REVISION: ${VISION_MODEL_REVISION:-unknown}
      VISION_MODEL: ${VISION_MODEL:-qwen3_vl_30b_a3b}
      EMBEDDING_BASE_URL: ${SINGLE_EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-VL-Embedding-2B}
      RELICSCOPE_REFERENCE_LIBRARY_ENABLED: ${RELICSCOPE_REFERENCE_LIBRARY_ENABLED:-true}
      RELICSCOPE_REFERENCE_LIBRARY_DIR: /var/lib/relicscope/reference-library
      RELICSCOPE_REFERENCE_LIBRARY_MANIFEST: /var/lib/relicscope/reference-library/manifest.json
      RELICSCOPE_REFERENCE_LIBRARY_INDEX: /var/lib/relicscope/reference-library/index.sqlite3
      RELICSCOPE_REFERENCE_LIBRARY_VECTOR_INDEX: /var/lib/relicscope/reference-library/embeddings.npz
      RELICSCOPE_REFERENCE_LIBRARY_CALIBRATION: /var/lib/relicscope/reference-library/calibration.json
      RELICSCOPE_REFERENCE_LIBRARY_MIN_ARTIFACTS: ${RELICSCOPE_REFERENCE_LIBRARY_MIN_ARTIFACTS:-50}
      RELICSCOPE_REFERENCE_LIBRARY_MIN_VIEWS: ${RELICSCOPE_REFERENCE_LIBRARY_MIN_VIEWS:-5}
      RELICSCOPE_COUNTERFEIT_LIBRARY_MIN_RECORDS: ${RELICSCOPE_COUNTERFEIT_LIBRARY_MIN_RECORDS:-10}
      REFERENCE_EMBEDDING_BASE_URL: http://reference-embedding:8010/v1
      REFERENCE_EMBEDDING_MODEL: ${REFERENCE_EMBEDDING_MODEL:-qwen3_vl_embedding_2b}
      REFERENCE_EMBEDDING_MODEL_SOURCE: ${REFERENCE_EMBEDDING_MODEL_SOURCE:-Qwen/Qwen3-VL-Embedding-2B}
      REFERENCE_EMBEDDING_MODEL_REVISION: ${REFERENCE_EMBEDDING_MODEL_REVISION:?set immutable cached reference embedding revision}
      REFERENCE_EMBEDDING_DIMENSION: ${REFERENCE_EMBEDDING_DIMENSION:-2048}
      REFERENCE_EMBEDDING_BATCH_SIZE: ${REFERENCE_EMBEDDING_BATCH_SIZE:-4}
      REFERENCE_EMBEDDING_TIMEOUT_SECONDS: ${REFERENCE_EMBEDDING_TIMEOUT_SECONDS:-180}
      REASONER_BASE_URL: http://vision:8000/v1
      REASONER_MODEL: ${VISION_MODEL:-qwen3_vl_30b_a3b}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    command:
      - /bin/sh
      - -ec
      - |
        service_key="$$(cat /run/secrets/service_api_key)"
        if [ "$${#service_key}" -lt 32 ]; then
          echo "FATAL: service API key is missing or shorter than 32 characters" >&2
          exit 78
        fi
        export VISION_API_KEY="$$service_key"
        export EMBEDDING_API_KEY="$$service_key"
        export REFERENCE_EMBEDDING_API_KEY="$$service_key"
        export REASONER_API_KEY="$$service_key"
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8088 --no-access-log
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${RELICSCOPE_PORT:-8088}:8088"
    volumes:
      - type: bind
        source: ${RELICSCOPE_DATA_HOST_DIR:-./runtime/data}
        target: /var/lib/relicscope
      - type: bind
        source: ./data
        target: /opt/relicscope/data
        read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - relicscope-single
    depends_on:
      vision:
        condition: service_healthy
      reference-embedding:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 4s
      start_period: 45s
      retries: 4
    labels:
      ai.relicscope.node: ${SINGLE_NODE_ID:-spark-single}
      ai.relicscope.role: single-spark-gateway-evidence-report
      ai.relicscope.runtime: single-spark-local-ai
      ai.relicscope.version: ${RELICSCOPE_SERVICE_VERSION:-1.2.0}

  vision:
    platform: linux/arm64
    image: ${VLLM_IMAGE:-relicscope-multimodal-vllm:0.20.0-arm64}
    restart: unless-stopped
    init: true
    ipc: host
    shm_size: 16gb
    gpus: all
    security_opt:
      - no-new-privileges:true
    secrets:
      - service_api_key
    environment:
      VISION_MODEL_SOURCE: ${VISION_MODEL_SOURCE:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      VISION_MODEL_REVISION: ${VISION_MODEL_REVISION:-unknown}
      VISION_MODEL: ${VISION_MODEL:-qwen3_vl_30b_a3b}
      MODEL_PROFILE: ${MODEL_PROFILE:-qwen3-vl}
      VISION_MAX_MODEL_LEN: ${VISION_MAX_MODEL_LEN:-32768}
      VISION_GPU_MEMORY_UTILIZATION: ${VISION_GPU_MEMORY_UTILIZATION:-0.80}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_MODULES_CACHE: /root/.cache/vllm/modules
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
      VLLM_LOGGING_LEVEL: INFO
      VLLM_SERVER_DEV_MODE: "0"
    volumes:
      - type: bind
        source: ${HF_CACHE_DIR:-./runtime/hf-cache}
        target: /root/.cache/huggingface
        read_only: true
      - type: bind
        source: ${VLLM_CACHE_DIR:-./runtime/vllm-cache}
        target: /root/.cache/vllm
    networks:
      - relicscope-single
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\" || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 20m
      retries: 5
    labels:
      ai.relicscope.node: ${SINGLE_NODE_ID:-spark-single}
      ai.relicscope.role: shared-multimodal-model
      ai.relicscope.runtime: single-spark-local-ai
      ai.relicscope.model.profile: ${MODEL_PROFILE:-qwen3-vl}
      ai.relicscope.model.source: ${VISION_MODEL_SOURCE:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      ai.relicscope.model.revision: ${VISION_MODEL_REVISION:-unknown}
      ai.relicscope.model.served: ${VISION_MODEL:-qwen3_vl_30b_a3b}

  reference-embedding:
    platform: linux/arm64
    image: ${REFERENCE_EMBEDDING_IMAGE:-relicscope-reference-embedding:1.0.0-arm64}
    build:
      context: .
      dockerfile: Dockerfile.embedding
      args:
        EMBEDDING_BASE_IMAGE: ${VLLM_BASE_IMAGE:-vllm/vllm-openai:v0.20.0}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
        EMBEDDING_UID: ${EMBEDDING_UID:-10002}
        EMBEDDING_GID: ${EMBEDDING_GID:-10002}
    restart: unless-stopped
    init: true
    gpus: all
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - service_api_key
    environment:
      REFERENCE_EMBEDDING_API_KEY_FILE: /run/secrets/service_api_key
      REFERENCE_EMBEDDING_MODEL: ${REFERENCE_EMBEDDING_MODEL:-qwen3_vl_embedding_2b}
      REFERENCE_EMBEDDING_MODEL_SOURCE: ${REFERENCE_EMBEDDING_MODEL_SOURCE:-Qwen/Qwen3-VL-Embedding-2B}
      REFERENCE_EMBEDDING_MODEL_REVISION: ${REFERENCE_EMBEDDING_MODEL_REVISION:?set immutable cached reference embedding revision}
      REFERENCE_EMBEDDING_DIMENSION: ${REFERENCE_EMBEDDING_DIMENSION:-2048}
      REFERENCE_EMBEDDING_BATCH_SIZE: ${REFERENCE_EMBEDDING_BATCH_SIZE:-4}
      REFERENCE_EMBEDDING_GPU_MEMORY_FRACTION: ${REFERENCE_EMBEDDING_GPU_MEMORY_FRACTION:-0.12}
      REFERENCE_EMBEDDING_MAX_IMAGE_BYTES: ${REFERENCE_EMBEDDING_MAX_IMAGE_BYTES:-10485760}
      REFERENCE_EMBEDDING_MAX_IMAGE_PIXELS: ${REFERENCE_EMBEDDING_MAX_IMAGE_PIXELS:-25000000}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_MODULES_CACHE: /tmp/hf-modules
      XDG_CACHE_HOME: /tmp/cache
      TORCH_HOME: /tmp/torch
      DO_NOT_TRACK: ${DO_NOT_TRACK:-1}
    volumes:
      - type: bind
        source: ${HF_CACHE_DIR:-./runtime/hf-cache}
        target: /models/huggingface
        read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    networks:
      - relicscope-single
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8010/v1/health',timeout=3)); assert p.get('ready') is True"
      interval: 20s
      timeout: 5s
      start_period: 15m
      retries: 5
    labels:
      ai.relicscope.node: ${SINGLE_NODE_ID:-spark-single}
      ai.relicscope.role: private-reference-image-embedding
      ai.relicscope.runtime: single-spark-local-ai
      ai.relicscope.model.source: ${REFERENCE_EMBEDDING_MODEL_SOURCE:-Qwen/Qwen3-VL-Embedding-2B}
      ai.relicscope.model.revision: ${REFERENCE_EMBEDDING_MODEL_REVISION:?set immutable cached reference embedding revision}
      ai.relicscope.model.served: ${REFERENCE_EMBEDDING_MODEL:-qwen3_vl_embedding_2b}

networks:
  relicscope-single:
    driver: bridge
    internal: true
    labels:
      ai.relicscope.scope: local-single-spark
      ai.relicscope.egress: blocked

secrets:
  service_api_key:
    file: ${SERVICE_API_KEY_FILE:-./secrets/service_api_key}
