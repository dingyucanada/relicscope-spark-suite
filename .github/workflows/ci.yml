name: repository-checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-dev.lock
      - name: Install pinned OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.11.0
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Python tests
        run: python -m pytest -q
      - name: Bundled synthetic media integrity
        run: python scripts/verify-demo-media.py
      - name: Headless image and video closed loop
        run: RELICSCOPE_SMOKE_PYTHON=python ./scripts/demo-media-smoke.sh
      - name: Deployment checks
        run: ./scripts/check-deployment.sh
      - name: OpenSpec strict validation
        run: openspec validate build-relicscope-dual-spark-demo --strict
