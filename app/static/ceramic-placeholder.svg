<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">古陶瓷受控成像占位示意</title>
  <desc id="desc">深色科学仪器背景中的青花瓷瓶轮廓、坐标网格与区域扫描标记。</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#3b91c0" stop-opacity=".22"/>
      <stop offset=".68" stop-color="#164567" stop-opacity=".07"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5eb"/>
      <stop offset=".42" stop-color="#b9d6db"/>
      <stop offset=".72" stop-color="#e8eee5"/>
      <stop offset="1" stop-color="#8cafb8"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset=".4" stop-color="#d8ebe9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6f9da8" stop-opacity=".28"/>
